<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hex64 通用符号引擎 v1.0</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f7fa; color: #333; line-height: 1.6; padding: 20px; }
.container { max-width: 860px; margin: 0 auto; }
h1 { text-align: center; color: #1a1a2e; margin-bottom: 8px; font-size: 1.8rem; }
.subtitle { text-align: center; color: #666; margin-bottom: 24px; font-size: 0.9rem; }
.card { background: #fff; border-radius: 12px; padding: 24px; margin-bottom: 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
.card h3 { color: #1a1a2e; margin-bottom: 12px; font-size: 1rem; border-left: 3px solid #4a6cf7; padding-left: 10px; }
.input-group { display: flex; gap: 10px; flex-wrap: wrap; }
.input-group input { flex: 1; min-width: 200px; padding: 10px 14px; border: 1px solid #d0d5dd; border-radius: 8px; font-size: 1rem; outline: none; }
.input-group input:focus { border-color: #4a6cf7; box-shadow: 0 0 0 3px rgba(74,108,247,0.1); }
.btn { background: #4a6cf7; color: #fff; border: none; padding: 10px 24px; border-radius: 8px; font-size: 1rem; cursor: pointer; transition: background 0.2s; }
.btn:hover { background: #3b5de7; }
.btn-secondary { background: #e9ecef; color: #333; }
.btn-secondary:hover { background: #d0d5dd; }
.result-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
.result-item { background: #f8f9fa; border-radius: 8px; padding: 14px; }
.result-item .label { font-size: 0.78rem; color: #888; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
.result-item .value { font-size: 1.1rem; font-weight: 600; color: #1a1a2e; word-break: break-all; }
.result-item .value.mono { font-family: 'SF Mono', 'Fira Code', monospace; }
.vec-bars { display: flex; gap: 4px; align-items: flex-end; height: 60px; padding: 8px 0; }
.vec-bar { flex: 1; background: #4a6cf7; border-radius: 3px 3px 0 0; min-height: 4px; transition: height 0.3s; position: relative; }
.vec-bar .bar-label { position: absolute; bottom: -18px; left: 50%; transform: translateX(-50%); font-size: 0.7rem; color: #888; }
.vec-bar .bar-val { position: absolute; top: -18px; left: 50%; transform: translateX(-50%); font-size: 0.7rem; font-weight: 600; color: #4a6cf7; }
.gpio-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.gpio-pin { padding: 6px 14px; border-radius: 6px; font-size: 0.85rem; font-family: 'SF Mono', 'Fira Code', monospace; font-weight: 600; }
.gpio-on { background: #d3f9d8; color: #2b8a3e; }
.gpio-off { background: #ffe3e3; color: #c92a2a; }
footer { text-align: center; color: #aaa; font-size: 0.78rem; margin-top: 32px; padding: 16px; }
.history-list { max-height: 200px; overflow-y: auto; }
.history-item { padding: 8px 12px; border-bottom: 1px solid #eee; cursor: pointer; display: flex; justify-content: space-between; font-size: 0.9rem; }
.history-item:hover { background: #f0f2f5; }
.history-input { color: #888; }
.history-result { color: #1a1a2e; font-weight: 500; }
@media (max-width: 600px) { .result-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="container">
    <h1>⚙ Hex64 通用符号引擎</h1>
    <p class="subtitle">基于邵雍先天六十四卦与莱布尼茨二进制映射的确定性编码基础设施 <span style="color:#999">v1.2</span></p>

  <div class="card">
    <div class="input-group">
      <input type="text" id="inputField" placeholder="输入任意内容（文本、数字、特征值...）" autofocus>
      <button class="btn" id="runBtn">启动转码引擎</button>
      <button class="btn btn-secondary" id="randomBtn">随机示例</button>
    </div>
  </div>

  <div class="card" id="resultCard" style="display:none">
    <h3>转码结果</h3>
    <div class="result-grid">
      <div class="result-item">
        <div class="label">卦编码</div>
        <div class="value mono" id="hexCode">--</div>
        <div style="font-size:0.85rem;color:#666;margin-top:4px" id="hexMeta"></div>
      </div>
      <div class="result-item">
        <div class="label">拼音 / English</div>
        <div class="value" style="font-size:0.9rem" id="hexPinyinEn">--</div>
      </div>
      <div class="result-item">
        <div class="label">分类</div>
        <div class="value" id="hexCategory">--</div>
      </div>
      <div class="result-item">
        <div class="label">权重</div>
        <div class="value" id="hexWeight">--</div>
      </div>
      <div class="result-item" style="grid-column: span 2;">
        <div class="label">特征向量 (6维)</div>
        <div class="vec-bars" id="vecBars"></div>
      </div>
      <div class="result-item" style="grid-column: span 2;">
        <div class="label">伪代码 (HexLang)</div>
        <div class="value mono" style="font-size:0.9rem" id="pseudoCode">--</div>
      </div>
      <div class="result-item" style="grid-column: span 2;">
        <div class="label">GPIO 控制信号</div>
        <div class="gpio-row" id="gpioRow"></div>
      </div>
    </div>
  </div>

  <div class="card" id="opCard" style="display:none">
    <h3>易经运算</h3>
    <div class="input-group" style="margin-bottom:12px">
      <input type="text" id="opInput" placeholder="输入参数" style="flex:0.5;min-width:100px" value="AI_training_data">
      <select id="opSelect" style="padding:10px 14px;border:1px solid #d0d5dd;border-radius:8px;font-size:1rem;background:#fff">
        <option value="cuo">错卦 (NOT · 卦位取反)</option>
        <option value="zong">综卦 (REV · 爻序反转)</option>
        <option value="bian">变爻 (XOR · 异或运算)</option>
        <option value="AND">卦叠加 AND</option>
        <option value="OR">卦叠加 OR</option>
        <option value="XOR">异或叠加 XOR</option>
      </select>
      <input type="text" id="opSecond" placeholder="第二输入（AND/OR/XOR 需要）" style="flex:0.5;min-width:120px" value="system_init">
      <button class="btn btn-secondary" id="opBtn">运算</button>
    </div>
    <div id="opResult" style="font-family:'SF Mono','Fira Code',monospace;font-size:0.9rem;background:#f8f9fa;border-radius:8px;padding:14px;white-space:pre-wrap"></div>
  </div>

  <div class="card">
    <h3>运算规则</h3>
    <table style="width:100%;border-collapse:collapse;font-size:0.88rem">
      <tr><th style="text-align:left;padding:6px 8px;border-bottom:1px solid #eee">易经概念</th><th style="text-align:left;padding:6px 8px;border-bottom:1px solid #eee">计算机指令</th><th style="text-align:left;padding:6px 8px;border-bottom:1px solid #eee">技术含义</th></tr>
      <tr><td style="padding:6px 8px">变爻</td><td style="padding:6px 8px;font-family:monospace">XOR</td><td style="padding:6px 8px">权重翻转、规则条件变更</td></tr>
      <tr><td style="padding:6px 8px">错卦</td><td style="padding:6px 8px;font-family:monospace">NOT</td><td style="padding:6px 8px">逻辑非、状态反转</td></tr>
      <tr><td style="padding:6px 8px">综卦</td><td style="padding:6px 8px;font-family:monospace">BIT_REVERSE</td><td style="padding:6px 8px">数据归一化、视角切换</td></tr>
      <tr><td style="padding:6px 8px">卦叠加</td><td style="padding:6px 8px;font-family:monospace">AND/OR</td><td style="padding:6px 8px">规则引擎多条件判断</td></tr>
    </table>
  </div>

  <div class="card">
    <h3>转码历史</h3>
    <div class="history-list" id="historyList"><div style="color:#aaa;padding:8px;font-size:0.9rem">暂无记录</div></div>
  </div>

  <footer>Hex64 v1.2 &middot; MIT License &middot; 非玄学工具，所有运算完全确定性</footer>
</div>

<script>
let HEXAGRAMS = [];
let tagToOp = {};

fetch('../data/hex64_full.json').then(r => r.json()).then(data => {
  HEXAGRAMS = data.hexagrams;
  tagToOp = data.tagToOp || {};
  document.getElementById('inputField').focus();
  render('Hello OpenCode');
  addHistory('Hello OpenCode');
});

function hash(input) {
  if (typeof input !== 'string') input = String(input);
  let h = 5381;
  for (let i = 0; i < input.length; i++) h = (h << 5) + h + input.charCodeAt(i);
  return h >>> 0;
}

function lookup(input) {
  const idx = hash(input) % 64;
  return { ...HEXAGRAMS[idx], index: idx };
}

function featureVector(input) {
  return lookup(input).bin.split('').map(Number);
}

function pseudoCode(input) {
  const hex = lookup(input);
  const ops = [...new Set(hex.tags.map(t => tagToOp[t] || t.toUpperCase()))];
  return `HEX(${hex.name}) { ${ops.join('; ')}; }`;
}

function controlSignal(input) {
  return featureVector(input).map(b => b ? 'ON' : 'OFF');
}

function render(input) {
  const hex = lookup(input);
  renderHex(hex);
  document.getElementById('opCard').style.display = 'block';
  document.getElementById('opInput').value = input;
}

function renderHex(hex) {
  const vec = hex.bin.split('').map(Number);
  const code = (() => {
    const ops = [...new Set(hex.tags.map(t => tagToOp[t] || t.toUpperCase()))];
    return `HEX(${hex.name}) { ${ops.join('; ')}; }`;
  })();
  const idx = hex.index != null ? hex.index : HEXAGRAMS.findIndex(h => h.bin === hex.bin);
  document.getElementById('hexCode').textContent = `${hex.bin} · ${hex.name}`;
  document.getElementById('hexMeta').textContent = `索引: ${idx} | 标签: ${hex.tags.join(', ')}`;
  document.getElementById('hexPinyinEn').textContent = `${hex.pinyin} · ${hex.en}`;
  document.getElementById('hexCategory').textContent = hex.category;
  document.getElementById('hexWeight').textContent = hex.weight.toFixed(2);
  document.getElementById('pseudoCode').textContent = code;
  const barsEl = document.getElementById('vecBars');
  barsEl.innerHTML = '';
  vec.forEach((v, i) => {
    const pct = v * 100;
    const bar = document.createElement('div');
    bar.className = 'vec-bar';
    bar.style.height = Math.max(pct, 4) + '%';
    bar.style.background = v ? '#4a6cf7' : '#d0d5dd';
    bar.innerHTML = `<div class="bar-val">${v}</div><div class="bar-label">爻${i+1}</div>`;
    barsEl.appendChild(bar);
  });
  const gpioEl = document.getElementById('gpioRow');
  gpioEl.innerHTML = '';
  vec.forEach((v, i) => {
    const pin = document.createElement('div');
    pin.className = `gpio-pin gpio-${v ? 'on' : 'off'}`;
    pin.textContent = `GPIO${i+1}=${v ? 'ON' : 'OFF'}`;
    gpioEl.appendChild(pin);
  });
  document.getElementById('resultCard').style.display = 'block';
}

const opLabels = { cuo: '错卦 (NOT)', zong: '综卦 (REV)', bian: '变爻 (XOR)', AND: 'AND', OR: 'OR', XOR: 'XOR' };

function operateUI() {
  const input = document.getElementById('opInput').value.trim() || 'default';
  const op = document.getElementById('opSelect').value;
  const second = document.getElementById('opSecond').value.trim() || undefined;
  const hex = lookup(input);
  const bits = hex.bin.split('').map(Number);
  let resultBits, detail = '';

  switch (op) {
    case 'cuo':
      resultBits = bits.map(b => b ^ 1);
      detail = `每位取反`;
      break;
    case 'zong':
      resultBits = [...bits].reverse();
      detail = `爻序反转`;
      break;
    case 'bian':
      if (second) {
        resultBits = bits.map((b, i) => b ^ parseInt(lookup(second).bin[i]));
        detail = `与「${lookup(second).name}」按位异或`;
      } else {
        resultBits = bits.map(b => b ^ 1);
        detail = `每位取反（无第二输入）`;
      }
      break;
    case 'AND':
      resultBits = second ? bits.map((b, i) => b & parseInt(lookup(second).bin[i])) : bits;
      detail = second ? `与「${lookup(second).name}」按位与` : `无第二输入，保持原值`;
      break;
    case 'OR':
      resultBits = second ? bits.map((b, i) => b | parseInt(lookup(second).bin[i])) : bits;
      detail = second ? `与「${lookup(second).name}」按位或` : `无第二输入，保持原值`;
      break;
    case 'XOR':
      resultBits = second ? bits.map((b, i) => b ^ parseInt(lookup(second).bin[i])) : bits.map(b => b ^ 1);
      detail = second ? `与「${lookup(second).name}」按位异或` : `每位取反（无第二输入）`;
      break;
  }

  const resultBin = resultBits.join('');
  const resultHex = HEXAGRAMS.find(h => h.bin === resultBin);
  const el = document.getElementById('opResult');
  el.innerHTML = `<span style="color:#888">输入</span> ${hex.bin} ${hex.name}
<span style="color:#888">运算</span> ${opLabels[op] || op}
<span style="color:#888">说明</span> ${detail}
<span style="color:#888">结果</span> ${resultBin} ${resultHex ? resultHex.name + ' · ' + resultHex.en : '自定义卦'}
<span style="color:#888">信号</span> ${resultBits.map(b => b ? 'ON' : 'OFF').join(' | ')}`;

  if (resultHex) renderHex(resultHex);
}

function addHistory(input) {
  const hex = lookup(input);
  const list = document.getElementById('historyList');
  const empty = list.querySelector('div');
  if (empty && list.children.length === 1 && empty.textContent === '暂无记录') list.innerHTML = '';
  const item = document.createElement('div');
  item.className = 'history-item';
  item.innerHTML = `<span class="history-input">${input}</span><span class="history-result">${hex.bin} ${hex.name}</span>`;
  item.onclick = () => { document.getElementById('inputField').value = input; render(input); };
  list.insertBefore(item, list.firstChild);
  if (list.children.length > 50) list.removeChild(list.lastChild);
}

const samples = ['Hello OpenCode', 'init', 'system_init', 'AI_training_data', 'db_connection', 'error_timeout', 'sensor_temp_85', 'hex64'];

function ready() { return HEXAGRAMS.length > 0; }

document.getElementById('runBtn').onclick = () => {
  if (!ready()) return;
  const val = document.getElementById('inputField').value.trim();
  if (!val) return;
  render(val);
  addHistory(val);
};

document.getElementById('inputField').onkeydown = (e) => {
  if (e.key === 'Enter') document.getElementById('runBtn').click();
};

document.getElementById('opBtn').onclick = () => { if (ready()) operateUI(); };
document.getElementById('opInput').onkeydown = (e) => { if (e.key === 'Enter' && ready()) operateUI(); };
document.getElementById('opSecond').onkeydown = (e) => { if (e.key === 'Enter' && ready()) operateUI(); };

document.getElementById('randomBtn').onclick = () => {
  if (!ready()) return;
  const s = samples[Math.floor(Math.random() * samples.length)];
  document.getElementById('inputField').value = s;
  render(s);
  addHistory(s);
};
</script>
</body>
</html>
